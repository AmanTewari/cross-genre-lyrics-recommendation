<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Cross-Genre Lyrics Recommendation</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
	<div class="app-bg">
		<!-- HEADER SECTION -->
		<header class="hero-header py-5 py-md-6">
			<div class="container-lg">
				<div class="text-center">
					<div class="hero-mark mb-3" aria-hidden="true">♪</div>
					<h1 class="hero-title">Cross-Genre Lyrics Recommendation</h1>
					<p class="hero-subtitle">Unsupervised Pattern Recognition Pipeline</p>
					<p class="hero-description">This system analyzes lyrical structure and recommends similar songs using unsupervised machine learning.</p>
				</div>
			</div>
		</header>

		<main class="container-lg pb-5">
			<!-- INPUT SECTION -->
			<section class="input-section mb-5">
				<div class="input-card p-4 p-md-5">
					<div class="mb-4">
						<label class="form-label" for="lyricsInput">Paste song lyrics here...</label>
						<textarea id="lyricsInput" class="form-control form-control-lg lyrics-input" rows="8" placeholder="Paste song lyrics here..." aria-label="Lyrics input"></textarea>
					</div>
					<div class="d-flex gap-2">
						<button id="analyzeBtn" class="btn btn-main btn-lg" type="button">Run Full Pipeline</button>
						<button id="resetBtn" class="btn btn-secondary btn-lg" type="button" hidden>Reset</button>
					</div>
				</div>
			</section>

			<!-- PIPELINE VISUALIZATION SECTION -->
			<section id="pipelineContainer" class="pipeline-section" hidden>
				<!-- Loading state -->
				<div id="loadingState" class="text-center py-5" hidden>
					<div class="spinner-border text-primary" role="status">
						<span class="visually-hidden">Loading...</span>
					</div>
					<p class="mt-3 text-muted">Running pipeline...</p>
				</div>

				<!-- Error state -->
				<div id="errorState" class="alert alert-danger" role="alert" hidden>
					<h4 class="alert-heading">Pipeline Error</h4>
					<p id="errorMessage"></p>
				</div>

				<!-- Pipeline stages will be inserted here -->
				<div id="pipelineStages"></div>

				<!-- Progress indicator -->
				<div id="progressIndicator" class="progress-tracker mt-5"></div>
			</section>
		</main>
	</div>

	<div id="toast-container" aria-hidden="true"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="app.js" defer></script>
</body>
</html>
